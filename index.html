<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALD1 翻譯網站</title>
    <link rel="icon" type="image/png" href="https://github.com/ald1a1mem.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f8fb;
            --card-bg: #ffffff;
            --text-color: #3b5973;
            --accent-color: #5698c3;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 頂部橫幅 Banner 區塊 */
        .banner {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 主體佈局：左側選單 + 右側內容網格 */
        .main-layout {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            gap: 30px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 左側分類選單 */
        .sidebar {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-btn {
            background: #ffffff;
            border: 2px solid transparent;
            color: var(--text-color);
            padding: 12px 20px;
            text-align: left;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .side-btn:hover, .side-btn.active {
            background: #e6f0f7;
            color: var(--accent-color);
            border-color: #b9d2e3;
        }

        /* 右側內容區塊 */
        .content-area {
            flex-grow: 1;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* 影片卡片網格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* 單張影片卡片 */
        .video-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(86, 152, 195, 0.08);
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(86, 152, 195, 0.15);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 比例 */
            background: #000;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-title {
            font-weight: 700;
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 0.8rem;
            color: #78909c;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #a0b9cc;
            font-size: 0.85rem;
            margin-top: auto;
        }

        /* RWD 手機響應式調整 */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 5px;
            }
            .side-btn {
                white-space: nowrap;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部 Banner -->
    <div class="banner">
        <!-- 這裡可以放你的 Banner 圖片 -->
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" alt="Banner">
    </div>

    <!-- 主要版型 -->
    <div class="main-layout">
        
        <!-- 左側選單 -->
        <div class="sidebar">
            <button class="side-btn active" onclick="switchTab('lives', this)">🔴 直播</button>
            <button class="side-btn" onclick="switchTab('shows', this)">📺 節目</button>
            <button class="side-btn" onclick="switchTab('media', this)">📰 媒體</button>
        </div>

        <!-- 右側內容清單 -->
        <div class="content-area">
            
            <!-- 直播分頁內容 -->
            <div id="lives" class="tab-pane active">
                <div class="video-grid">
                    <!-- 影片卡片 1 -->
                    <a href="https://www.youtube.com/watch?v=你的影片ID" target="_blank" class="video-card">
                        <div class="thumbnail-container">
                            <img src="https://img.youtube.com/vi/你的影片ID/mqdefault.jpg" alt="封面">
                        </div>
                        <div class="video-details">
                            <div class="video-title">20260725 FLARE U IG直播</div>
                            <div class="video-meta">
                                翻譯：Lupus<br>
                                字幕製作：西卡<br>
                                校對：西卡
                            </div>
                        </div>
                    </a>
                    
                    <!-- 可以複製上面這段 <a class="video-card">...</a> 來新增更多卡片 -->
                </div>
            </div>

            <!-- 節目分頁內容 -->
            <div id="shows" class="tab-pane">
                <div class="video-grid">
                    <a href="https://www.youtube.com/watch?v=你的影片ID" target="_blank" class="video-card">
                        <div class="thumbnail-container">
                            <img src="https://img.youtube.com/vi/你的影片ID/mqdefault.jpg" alt="封面">
                        </div>
                        <div class="video-details">
                            <div class="video-title">20260724 Another Class 節目</div>
                            <div class="video-meta">
                                翻譯：Lupus<br>
                                字幕製作：西卡
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- 媒體分頁內容 -->
            <div id="media" class="tab-pane">
                <div class="video-grid">
                    <!-- 媒體內容卡片 -->
                </div>
            </div>

        </div>
    </div>

    <footer>
        &copy; ald1.a1mem
    </footer>

    <!-- 切換分頁的 JavaScript -->
    <script>
        function switchTab(tabId, btnElement) {
            // 隱藏所有右側內容
            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => pane.classList.remove('active'));

            // 移除所有左側按鈕的 active 樣式
            const buttons = document.querySelectorAll('.side-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 顯示點擊的對應分頁與按鈕樣式
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
